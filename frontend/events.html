
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VCET Events - Events</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<aside class="site-sidebar">

    <h2 class="sidebar-brand">VCET Events</h2>

   <nav class="sidebar-nav">
    <a href="index.html">Home</a>
    <a href="events.html">Events</a>
    <a href="admin.html">Admin</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
</nav>

</aside>

<main class="page-content">

    <section class="events">
        <h1>Upcoming College Events</h1>
        <p>Explore and register for exciting college events.</p>

        <div id="event-list">
            <p>Loading events...</p>
        </div>
    </section>

    <section class="feedback">
        <h2>Event Feedback</h2>

        <form id="feedbackForm">
            <input type="number" id="registrationId"
                placeholder="Registration ID" required>

            <select id="rating" required>
                <option value="">Select Rating</option>
                <option value="5">5 - Excellent</option>
                <option value="4">4 - Very Good</option>
                <option value="3">3 - Good</option>
                <option value="2">2 - Average</option>
                <option value="1">1 - Poor</option>
            </select>

            <textarea id="comments"
                placeholder="Write your feedback"></textarea>

            <button type="submit">Submit Feedback</button>
        </form>

        <p id="feedbackMessage"></p>
    </section>

    <footer>
        <p>College Event Management System | VCET</p>
    </footer>

</main>

<script src="script.js"></script>

</body>
</html>
